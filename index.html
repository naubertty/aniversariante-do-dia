<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Editor - Aniversariante do Dia</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#14213d;--mut:#5b6577;--bd:#d6dbe6;--ac:#0a3cff;--acx:#fff}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10131a;--card:#1a1f2b;--tx:#eef1f8;--mut:#9aa4b8;--bd:#2d3546;--ac:#4a72ff;--acx:#fff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Poppins,system-ui,sans-serif}
main{max-width:980px;margin:0 auto;padding:16px;display:grid;gap:16px;grid-template-columns:1fr}
@media(min-width:800px){main{grid-template-columns:340px 1fr;align-items:start}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:16px;display:grid;gap:12px}
h1{font-size:18px;margin:0;font-weight:800}
label{font-size:13px;color:var(--mut);display:grid;gap:4px;font-family:system-ui,sans-serif}
input[type=text]{padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
input[type=file]{font-size:14px;color:var(--tx)}
input[type=color]{width:100%;height:40px;padding:2px;border:1px solid var(--bd);border-radius:8px;background:var(--bg)}
button{padding:12px;border:0;border-radius:10px;background:var(--ac);color:var(--acx);font:800 15px Poppins,system-ui,sans-serif;cursor:pointer}
.stage{display:grid;justify-items:center;gap:8px}
canvas{width:100%;max-width:405px;height:auto;aspect-ratio:9/16;border:1px solid var(--bd);border-radius:10px;touch-action:none;cursor:grab;background:#050b1f}
small{color:var(--mut);font-family:system-ui,sans-serif;text-align:center}
</style></head><body>
<main>
<section class="panel">
<h1>🎈 Aniversariante do dia</h1>
<label>Nome da pessoa (aparece na faixa vermelha)<input type="text" id="name" placeholder="Ex.: João da Silva" maxlength="40"></label>
<label>Cor do nome<input type="color" id="namecolor" value="#ffffff"></label>
<label>Imagem de fundo (opcional)<input type="file" id="bg" accept="image/*"></label>
<label>Zoom do fundo<input type="range" id="zoom" min="1" max="3" step="0.01" value="1"></label>
<button id="save">Baixar imagem</button>
<small id="msg">Arraste a imagem no preview para reposicionar o fundo.</small>
</section>
<section class="stage">
<canvas id="c" width="1080" height="1920"></canvas>
<small>Dica: se o botão não baixar, segure/clique com o botão direito na imagem para salvar.</small>
</section>
</main>

const c=document.getElementById('c'),x=c.getContext('2d');
const $=id=>document.getElementById(id);
const tpl=new Image();let bg=null,ox=0,oy=0;
tpl.onload=draw;tpl.src=TPL_SRC;

// Faixa vermelha do modelo: x 97..976, y 1151..1283
const BAR={cx:536,cy:1217,maxW:820,maxH:112};

function fitFont(text,maxW,maxH,start){
  let s=start;
  while(s>20){
    x.font=`800 ${s}px Poppins,Arial,sans-serif`;
    const m=x.measureText(text);
    const h=m.actualBoundingBoxAscent+m.actualBoundingBoxDescent;
    if(m.width<=maxW && h<=maxH) break;
    s-=2;
  }
  return s;
}

function draw(){
  x.clearRect(0,0,1080,1920);
  x.fillStyle='#050b1f';x.fillRect(0,0,1080,1920);
  if(bg){
    const z=+$('zoom').value,s=Math.max(1080/bg.width,1920/bg.height)*z,w=bg.width*s,h=bg.height*s;
    ox=Math.min(0,Math.max(1080-w,ox));oy=Math.min(0,Math.max(1920-h,oy));
    x.drawImage(bg,ox,oy,w,h);
  }
  if(tpl.complete && tpl.naturalWidth) x.drawImage(tpl,0,0,1080,1920);

  const name=$('name').value.trim().toUpperCase();
  if(name){
    const s=fitFont(name,BAR.maxW,BAR.maxH,110);
    x.font=`800 ${s}px Poppins,Arial,sans-serif`;
    x.textAlign='center';x.textBaseline='middle';
    x.fillStyle=$('namecolor').value;
    x.fillText(name,BAR.cx,BAR.cy);
  }
}

Promise.all([document.fonts.load('800 60px Poppins')]).then(draw).catch(()=>{});
['name','namecolor','zoom'].forEach(i=>$(i).addEventListener('input',draw));

$('bg').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const im=new Image();
  im.onload=()=>{
    bg=im;$('zoom').value=1;
    const s=Math.max(1080/im.width,1920/im.height);
    ox=(1080-s*im.width)/2;oy=(1920-s*im.height)/2;
    draw();
  };
  im.src=URL.createObjectURL(f);
});

let drag=null;
c.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};c.setPointerCapture(e.pointerId)});
c.addEventListener('pointermove',e=>{
  if(!drag||!bg)return;
  const k=1080/c.getBoundingClientRect().width;
  ox+=(e.clientX-drag.x)*k;oy+=(e.clientY-drag.y)*k;
  drag={x:e.clientX,y:e.clientY};draw();
});
c.addEventListener('pointerup',()=>drag=null);

$('save').addEventListener('click',()=>{
  c.toBlob(b=>{
    try{
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      const nome=($('name').value.trim()||'aniversariante').toLowerCase().replace(/[^a-z0-9]+/g,'-');
      a.download='parabens-'+nome+'.png';
      document.body.appendChild(a);a.click();a.remove();
      $('msg').textContent='Imagem pronta!';
    }catch(e){
      $('msg').textContent='Não foi possível baixar. Salve pela própria imagem (segure/botão direito).';
    }
  },'image/png');
});
